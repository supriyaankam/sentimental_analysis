{% extends "base.html" %}
{% block title %}Reset Password — SentimentIQ{% endblock %}

{% block content %}
<div class="container py-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card analysis-card">
        <div class="card-header">
          <i class="bi bi-shield-lock me-2"></i><strong>Choose a new password</strong>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
              <label for="new_password" class="form-label">New password</label>
              <input id="new_password" name="new_password" type="password" class="form-control"
                     minlength="12" maxlength="128" autocomplete="new-password"
                     pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,128}"
                     title="Use 12-128 characters with uppercase and lowercase letters, a number, and a special character."
                     required autofocus/>
              <div class="form-text">
                Use 12-128 characters, including uppercase and lowercase letters, a number, and a special character.
              </div>
            </div>
            <div class="mb-4">
              <label for="password_confirm" class="form-label">Confirm new password</label>
              <input id="password_confirm" name="password_confirm" type="password" class="form-control"
                     minlength="12" maxlength="128" autocomplete="new-password" required/>
            </div>
            <button type="submit" class="btn btn-analyze w-100">
              <i class="bi bi-shield-check me-2"></i>Reset password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
