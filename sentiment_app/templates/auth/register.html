{% extends "base.html" %}
{% block title %}Create Account — SentimentIQ{% endblock %}

{% block content %}
<div class="container py-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card analysis-card">
        <div class="card-header">
          <i class="bi bi-person-plus me-2"></i><strong>Create your account</strong>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input id="username" name="username" type="text" class="form-control"
                     value="{{ username }}" maxlength="50" autocomplete="nickname" required autofocus/>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input id="email" name="email" type="email" class="form-control"
                     value="{{ email }}" maxlength="254" autocomplete="email" required/>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" name="password" type="password" class="form-control"
                     minlength="12" maxlength="128" autocomplete="new-password"
                     pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,128}"
                     title="Use 12-128 characters with uppercase and lowercase letters, a number, and a special character."
                     required/>
              <div class="form-text">
                Use 12-128 characters, including uppercase and lowercase letters, a number, and a special character.
              </div>
            </div>
            <div class="mb-4">
              <label for="password_confirm" class="form-label">Confirm password</label>
              <input id="password_confirm" name="password_confirm" type="password" class="form-control"
                     minlength="12" maxlength="128" autocomplete="new-password" required/>
            </div>
            <button type="submit" class="btn btn-analyze w-100">
              <i class="bi bi-person-plus me-2"></i>Create account
            </button>
          </form>
          <p class="text-muted text-center small mt-4 mb-0">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
